server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/ai-prompt-training-deck;
    index index.html;

    # TLS 인증서와 443 server 블록은 배포 환경에서 별도로 설정합니다.
    # 자세한 절차는 docs/DEPLOY_OCI.md를 참고하세요.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Vite가 콘텐츠 해시를 붙인 JS/CSS 번들은 장기 캐시합니다.
    location ~* ^/assets/.*-[A-Za-z0-9_-]{8,}\.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    # 동일 파일명으로 교체할 수 있는 발표 이미지·캐릭터는 짧게 캐시합니다.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
