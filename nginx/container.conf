server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite가 콘텐츠 해시를 붙인 JS/CSS 번들은 장기 캐시합니다.
    location ~* "^/assets/.*-[A-Za-z0-9_-]{8,}\.(?:css|js)$" {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    # 교체용 WebP가 아직 없으면 같은 구도의 SVG placeholder를 200으로 제공합니다.
    # 실제 WebP를 같은 경로에 두면 try_files가 새 파일을 우선합니다.
    location = /assets/images/source-photo.webp {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /assets/images/source-photo-placeholder.svg;
        access_log off;
    }

    location = /assets/images/transformed-photo.webp {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /assets/images/transformed-photo-placeholder.svg;
        access_log off;
    }

    # 동일 파일명으로 교체할 수 있는 발표 이미지·캐릭터는 짧게 캐시합니다.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
        access_log off;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
